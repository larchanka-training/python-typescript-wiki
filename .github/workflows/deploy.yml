name: Deploy monorepo (dev/acc/prd)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Куда деплоим"
        type: choice
        required: true
        options:
          - dev
          - acc
          - prd
      ref:
        description: "Git ref для деплоя (ветка/тег/SHA). Если пусто — текущий ref."
        type: string
        required: false
        default: ""
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'acc' || inputs.target }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.out.outputs.target }}
      ref: ${{ steps.out.outputs.ref }}
      tag: ${{ steps.out.outputs.tag }}
      is_main: ${{ steps.out.outputs.is_main }}
    steps:
      - id: out
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            target="acc"
            ref="${{ github.sha }}"
          else
            target="${{ inputs.target }}"
            if [ -n "${{ inputs.ref }}" ]; then
              ref="${{ inputs.ref }}"
            else
              ref="${{ github.sha }}"
            fi
          fi

          is_main="false"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            is_main="true"
          fi

          short_sha="$(echo "${{ github.sha }}" | cut -c1-12)"
          tag="${target}-${short_sha}"

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "is_main=$is_main" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: prepare
    environment: ${{ needs.prepare.outputs.target }}

    # dev можно деплоить с любой ветки (вручную),
    # acc/prd — только из main
    if: |
      (needs.prepare.outputs.target == 'dev') ||
      (github.ref == 'refs/heads/main' && (needs.prepare.outputs.target == 'acc' || needs.prepare.outputs.target == 'prd'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ needs.prepare.outputs.tag }}
            ghcr.io/${{ github.repository }}/api:latest-${{ needs.prepare.outputs.target }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ needs.prepare.outputs.tag }}
            ghcr.io/${{ github.repository }}/frontend:latest-${{ needs.prepare.outputs.target }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust host key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ vars.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare deploy bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy_bundle

          printf '%s\n' "REGISTRY=ghcr.io" > .deploy_bundle/.env.deploy
          printf '%s\n' "IMAGE_PREFIX=${{ github.repository }}" >> .deploy_bundle/.env.deploy
          printf '%s\n' "TAG=${{ needs.prepare.outputs.tag }}" >> .deploy_bundle/.env.deploy
          printf '%s\n' "APP_PORT=${{ vars.APP_PORT }}" >> .deploy_bundle/.env.deploy
          printf '%s\n' "API_PORT=${{ vars.API_PORT }}" >> .deploy_bundle/.env.deploy

          printf '%s' "${{ secrets.API_ENV_FILE }}" > .deploy_bundle/.env.api
          printf '%s' "${{ secrets.FRONTEND_ENV_FILE }}" > .deploy_bundle/.env.frontend
          printf '%s' "${{ secrets.POSTGRES_ENV_FILE }}" > .deploy_bundle/.env.postgres

      - name: Upload deploy files
        shell: bash
        run: |
          set -euo pipefail
          scp -o StrictHostKeyChecking=yes deploy/docker-compose.deploy.yml "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:${{ vars.DEPLOY_PATH }}/docker-compose.deploy.yml"
          scp -o StrictHostKeyChecking=yes .deploy_bundle/.env.deploy "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:${{ vars.DEPLOY_PATH }}/.env.deploy"
          scp -o StrictHostKeyChecking=yes .deploy_bundle/.env.api "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:${{ vars.DEPLOY_PATH }}/.env.api"
          scp -o StrictHostKeyChecking=yes .deploy_bundle/.env.frontend "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:${{ vars.DEPLOY_PATH }}/.env.frontend"
          scp -o StrictHostKeyChecking=yes .deploy_bundle/.env.postgres "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:${{ vars.DEPLOY_PATH }}/.env.postgres"

      - name: Remote deploy (docker compose pull + up)
        shell: bash
        run: |
          set -euo pipefail

          ssh -o StrictHostKeyChecking=yes "${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}" bash -s <<'REMOTE'
          set -euo pipefail

          cd "${DEPLOY_PATH}"

          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

          docker compose --env-file .env.deploy -f docker-compose.deploy.yml pull
          docker compose --env-file .env.deploy -f docker-compose.deploy.yml up -d --remove-orphans

          docker image prune -f
          REMOTE
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

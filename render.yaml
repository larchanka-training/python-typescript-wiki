envVarGroups:
  - name: wiki-secrets
    envVars:
      - key: OAUTH_NAME_APPLICATION_ID
        sync: false
      - key: OAUTH_NAME_SECRET_KEY
        sync: false
databases:
  - name: wiki-db
    databaseName: wiki
    user: admin
    plan: free
services:
  # API Service
  - type: web
    name: wiki-api
    runtime: python
    rootDir: api
    plan: free
    region: frankfurt
    envVars:
      - fromGroup: wiki-secrets
      - key: DATABASE_URL
        fromDatabase:
          name: wiki-db
          property: connectionString
      - key: TOKEN_TTL_SECONDS
        value: 86400
      - key: SESSION_TTL_SECONDS
        value: 604800
    buildCommand: ls && cd api && pip install -r requirements.txt
    startCommand: alembic upgrade head && fastapi run app/main.py --host 0.0.0.0 --port 8000

  # Frontend Service (Static Site for Vite app)
  - type: web
    runtime: node
    name: wiki-frontend
    rootDir: frontend
    plan: free
    region: frankfurt
    buildCommand: ls && cd frontend && npm install
    startCommand: cd frontend && npm run dev
    envVars:
      - key: VITE_API_URL
        value: /api

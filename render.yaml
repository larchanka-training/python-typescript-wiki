projects:
  - name: Wiki
    environments:
      - name: development
        databases:
          - name: wiki-db
            databaseName: wiki
            region: frankfurt
            user: admin
            plan: free
        services:
          # API Service
          - type: web
            name: wiki-api
            runtime: python
            plan: free
            region: frankfurt
            branch: develop
            envVars:
              - fromGroup: wiki-secrets-dev
              - key: DATABASE_URL
                fromDatabase:
                  name: wiki-db
                  property: connectionString
              - key: TOKEN_TTL_SECONDS
                value: 86400
              - key: SESSION_TTL_SECONDS
                value: 604800
            buildCommand: git config --global url."https://${GITHUB_USERNAME}:${GITHUB_ACCESS_TOKEN}@github.com".insteadOf "https://github.com" && git submodule update --init --recursive && cd ./api && pip install -r requirements.txt
            startCommand: cd ./api && alembic upgrade head && fastapi run app/main.py --host •••.•••.•••.••• --port 10000

          # Frontend Service
          - type: web
            runtime: node
            name: wiki-frontend
            branch: develop
            plan: free
            region: frankfurt
            buildCommand: git config --global url."https://${GITHUB_USERNAME}:${GITHUB_ACCESS_TOKEN}@github.com".insteadOf "https://github.com" && git submodule update --init --recursive && cd ./frontend && npm install
            startCommand: cd ./frontend && npm run dev
            envVars:
              - fromGroup: wiki-secrets-dev

      - name: production
        databases:
          - name: wiki-db
            databaseName: wiki
            region: frankfurt
            user: admin
            plan: free
        services:
          # API Service
          - type: web
            name: wiki-api
            runtime: python
            plan: free
            region: frankfurt
            branch: main
            envVars:
              - fromGroup: wiki-secrets-prd
              - key: DATABASE_URL
                fromDatabase:
                  name: wiki-db
                  property: connectionString
              - key: TOKEN_TTL_SECONDS
                value: 86400
              - key: SESSION_TTL_SECONDS
                value: 604800
            buildCommand: git config --global url."https://${GITHUB_USERNAME}:${GITHUB_ACCESS_TOKEN}@github.com".insteadOf "https://github.com" && git submodule update --init --recursive && cd ./api && pip install -r requirements.txt
            startCommand: cd ./api && alembic upgrade head && fastapi run app/main.py --host 0.0.0.0 --port 10000

          # Frontend Service
          - type: web
            runtime: node
            name: wiki-frontend
            branch: main
            plan: free
            region: frankfurt
            buildCommand: git config --global url."https://${GITHUB_USERNAME}:${GITHUB_ACCESS_TOKEN}@github.com".insteadOf "https://github.com" && git submodule update --init --recursive && cd ./frontend && npm install
            startCommand: cd ./frontend && npm run dev
            envVars:
              - fromGroup: wiki-secrets-prd
